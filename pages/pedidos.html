        rel="stylesheet"
    >


    <!-- =========================================

    ========================================== -->

    <link

        href="../css/styles.css"
        rel="stylesheet"
    >

        rel="stylesheet"

        integrity="sha256-p4NxAoJBhIINfM5oF5pXQ3kWQxN4zQ5xK3pF0W5xZ8M="

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>


    <!-- =========================================
         ESTILOS DE LA PÁGINA
    ========================================== -->

    <style>

        #map {
            height: 400px;
            width: 100%;
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
        }


        .pedido-container {
            padding-top: 20px;
            padding-bottom: 40px;
        }


        .pedido-title {
            margin-bottom: 30px;
        }


        .pedido-section {
            margin-bottom: 25px;
        }


        .pedido-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }


        .pedido-buttons button {
            margin: 0;
        }


        #qr {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .direccion-container {
            margin-top: 10px;
        }


        @media only screen and (max-width: 600px) {

            .pedido-container {
                padding-left: 20px;
                padding-right: 20px;
            }


            .pedido-buttons {
                flex-direction: column;
            }


            .pedido-buttons button {
                width: 100%;
            }


            #map {
                height: 300px;
            }

        }

    </style>


    <!-- =========================================
         MANIFEST
    ========================================== -->

    <link
        rel="manifest"
        href="../manifest.json"
    >


    <!-- =========================================
         CONFIGURACIÓN PWA
    ========================================== -->

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta

        content="DITS"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="DITS"
    >

    <meta
        name="theme-color"
        content="#4dc7e4"
    >

    <meta
        name="msapplication-navbutton-color"
        content="#4dc7e4"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >


    <!-- =========================================
         ICONOS
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="../icon-16x16.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="../icon-32x32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="64x64"
        href="../icon-64x64.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="128x128"
        href="../icon-128x128.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="../icon-192x192.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="../icon-512x512.png"
    >

</head>


<body class="grey lighten-4">


    <!-- =========================================
         MENÚ SUPERIOR
    ========================================== -->

    <nav class="z-depth-0">

        <div class="nav-wrapper container">

            <a href="../">
                DITS
            </a>


            <span class="right grey-text text-darken-1">

                <i
                    class="material-icons sidenav-trigger"
                    data-target="side-menu"
                >
                    menu
                </i>

            </span>

        </div>

    </nav>


    <!-- =========================================
         MENÚ LATERAL
    ========================================== -->

    <ul
        id="side-menu"
        class="sidenav side-menu"
    >

        <li>

            <a class="subheader">
                DITS
            </a>

        </li>


        <li>

            <a
                href="../"
                class="waves-effect"
            >

                <i class="material-icons">
                    home
                </i>

                Inicio

            </a>

        </li>


        <li>

            <a
                href="pedidos.html"
                class="waves-effect"
            >

                <i class="material-icons">
                    restaurant_menu
                </i>

                Pedidos

            </a>

        </li>


        <li>

            <a
                href="about.html"
                class="waves-effect"
            >

                <i class="material-icons">
                    info
                </i>

                Acerca

            </a>

        </li>


        <li>

            <div class="divider"></div>

        </li>


        <li>

            <a
                href="contact.html"
                class="waves-effect"
            >

                <i class="material-icons">
                    mail_outline
                </i>

                Contacto

            </a>

        </li>

    </ul>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="container grey-text pedido-container">


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <h5 class="center pedido-title">

            Realizar pedido

        </h5>


        <!-- =====================================
             SELECCIÓN DE PLATILLO
        ====================================== -->

        <div class="pedido-section">

            <label for="listaPlatillos">
                Platillo:
            </label>


            <select
                id="listaPlatillos"
                name="platillo"
                class="browser-default"
            >

                <option
                    value=""
                    selected
                >
                    -- Selecciona un platillo --
                </option>

            </select>

        </div>


        <!-- =====================================
             NOMBRE
        ====================================== -->

        <div class="input-field">

            <input
                type="text"
                id="txtNombre"
                name="nombre"
                placeholder="Ingresa tu nombre"
            >


            <label for="txtNombre">
                Nombre
            </label>

        </div>


        <!-- =====================================
             DIRECCIÓN
        ====================================== -->

        <div class="input-field direccion-container">

            <textarea
                id="txtDireccion"
                name="direccion"
                class="materialize-textarea"
                placeholder="Ingresa tu dirección completa"
            ></textarea>


            <label for="txtDireccion">
                Dirección
            </label>

        </div>


        <!-- =====================================
             BOTONES
        ====================================== -->

        <div class="pedido-buttons">


            <!-- CANCELAR -->

            <button
                id="btnCancelar"
                type="button"
                class="btn red waves-effect waves-light"
            >

                <i class="material-icons left">
                    close
                </i>

                Cancelar

            </button>


            <!-- GUARDAR -->

            <button
                id="btnGuardar"
                type="button"
                class="btn green waves-effect waves-light"
            >

                <i class="material-icons left">
                    save
                </i>

                Guardar

            </button>


            <!-- UBICACIÓN -->

            <button
                id="btnUbicacion"
                type="button"
                class="btn blue waves-effect waves-light"
            >

                <i class="material-icons left">
                    location_on
                </i>

                Obtener dirección

            </button>


        </div>


        <!-- =====================================
             MAPA
        ====================================== -->

        <div id="map"></div>


        <!-- =====================================
             QR
        ====================================== -->

        <div id="qr"></div>


    </main>


    <!-- =========================================
         FIREBASE APP
    ========================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"
    ></script>


    <!-- =========================================
         FIREBASE FIRESTORE
    ========================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"
    ></script>


    <!-- =========================================
         CONFIGURACIÓN FIREBASE
    ========================================== -->

    <script src="../js/firebase.js"></script>


    <!-- =========================================
         QR CODE
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <!-- =========================================
         BASE DE DATOS
    ========================================== -->

    <script src="../js/db.js"></script>


    <!-- =========================================
         PEDIDOS
    ========================================== -->

    <script src="../js/pedidos.js"></script>


</body>

</html>
