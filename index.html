  <!-- Lista de platillos -->
  <div class="recipes container grey-text text-darken-1">
  </div>

  <div class="center">
    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- Agregar platillo -->
  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6 >Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="ejemplo: Pizza" id="title" type="text" class="validate">
        <label for="title">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
        <label for="ingredients">Ingredientes</label>
      </div>
      <input id="fotoInput" type="hidden" value="">
      <div class="input-field">
        <input placeholder="ejemplo: 100" id="price" type="number" class="validate">
        <label for="price">Precio</label>
      </div>
      <div class="input-field center">
        <button class="btn-small">Agregar</button>
      </div>
    </form>
   
   <div class="center">
  <!-- Subir archivo desde galería -->
  <input type="file" id="btnFoto" accept="image/*">

  <!-- Nuevo botón para abrir cámara -->
  <button id="btnCamara" class="btn-small green">Usar cámara</button>

  <button id="btnCapturar" class="btn-small">Capturar</button>
  <button id="btnLimpiar" class="btn-small red">Limpiar</button>
</div>
<div id="Camera">
  <video id="Video" autoplay playsinline>Video no disponible</video>
</div>
<canvas id="Canvas" style="display:none;"></canvas>
<div id="Salida">
  <img id="foto" src="img/default.jpg" alt="Foto del platillo">

</div>
