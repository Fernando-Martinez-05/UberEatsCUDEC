    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"

    >


    <!-- =========================================

    <link

    <!-- =========================================

    <!-- =========================================

    ========================================== -->

    >

    ========================================== -->

    >

    >

    <link

    >

        rel="apple-touch-icon"

    >

    <link

        href="icon-128x128.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon-128x128.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="icon-192x192.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192x192.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="icon-512x512.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon-512x512.png"
    >

</head>


<body class="grey lighten-4">


    <!-- =========================================
         MENU SUPERIOR
    ========================================== -->

    <nav class="z-depth-0">

        <div class="nav-wrapper container">

            <a href="/">
                DITS
            </a>

            <span class="right grey-text text-darken-1">

                <i
                    class="material-icons sidenav-trigger"
                    data-target="side-menu"
                >
                    menu
                </i>

            </span>

        </div>

    </nav>


    <!-- =========================================
         MENU LATERAL
    ========================================== -->

    <ul
        id="side-menu"
        class="sidenav side-menu"
    >

        <li>

            <a class="subheader">
                DITS
            </a>

        </li>


        <li>

            <a
                href="/"
                class="waves-effect"
            >
                Inicio
            </a>

        </li>


        <li>

            <a
                href="pages/pedidos.html"
                class="waves-effect"
            >
                Pedidos
            </a>

        </li>


        <!-- =====================================
             TOMAR FOTO
        ====================================== -->

        <li>

            <a
                href="#camera-menu"
                id="abrirCamara"
                class="waves-effect"
            >

                <i class="material-icons">
                    camera_alt
                </i>

                Tomar foto

            </a>

        </li>


        <li>

            <a
                href="pages/about.html"
                class="waves-effect"
            >
                Acerca
            </a>

        </li>


        <li>

            <div class="divider"></div>

        </li>


        <li>

            <a
                href="pages/contact.html"
                class="waves-effect"
            >

                <i class="material-icons">
                    mail_outline
                </i>

                Contacto

            </a>

        </li>

    </ul>


    <!-- =========================================
         LISTA DE PLATILLOS
    ========================================== -->

    <div
        class="recipes container grey-text text-darken-1"
    >
    </div>


    <!-- =========================================
         BOTÓN AGREGAR
    ========================================== -->

    <div class="center">

        <a
            class="btn-floating btn-large add-btn sidenav-trigger"
            data-target="side-form"
        >

            <i class="material-icons">
                add
            </i>

        </a>

    </div>


    <!-- =========================================
         AGREGAR PLATILLO
    ========================================== -->

    <div
        id="side-form"
        class="sidenav side-form"
    >

        <form
            id="formAgregar"
            class="add-recipe container section"
        >

            <h6>
                Nuevo platillo
            </h6>

            <div class="divider"></div>


            <!-- NOMBRE -->

            <div class="input-field">

                <input
                    placeholder="Ejemplo: Pizza"
                    id="title"
                    name="title"
                    type="text"
                    class="validate"
                    required
                >

                <label for="title">
                    Nombre
                </label>

            </div>


            <!-- INGREDIENTES -->

            <div class="input-field">

                <input
                    placeholder="Ejemplo: Queso, tomate, harina"
                    id="ingredients"
                    name="ingredients"
                    type="text"
                    class="validate"
                    required
                >

                <label for="ingredients">
                    Ingredientes
                </label>

            </div>


            <!-- PRECIO -->

            <div class="input-field">

                <input
                    placeholder="Costo"
                    id="price"
                    name="price"
                    type="number"
                    class="validate"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="price">
                    Precio
                </label>

            </div>


            <!-- BOTÓN AGREGAR -->

            <div class="input-field center">

                <button
                    id="btnAgregarPlatillo"
                    type="submit"
                    class="btn-small"
                >
                    Agregar
                </button>

            </div>

        </form>

    </div>


    <!-- =========================================
         MENÚ LATERAL DE LA CÁMARA
    ========================================== -->

    <div
        id="camera-menu"
        class="sidenav side-form"
    >

        <div class="container section">

            <h6>

                <i class="material-icons">
                    camera_alt
                </i>

                Tomar foto

            </h6>


            <div class="divider"></div>

            <br>


            <!-- ESTADO -->

            <p
                id="cameraStatus"
                class="grey-text"
            >
                Iniciando cámara...
            </p>


            <!-- =================================
                 CÁMARA
            ================================== -->

            <div class="center">

                <video
                    id="video"
                    width="320"
                    height="240"
                    autoplay
                    playsinline
                    muted
                    style="
                        width: 100%;
                        max-width: 320px;
                        height: auto;
                        border-radius: 10px;
                        background: #000;
                    "
                >
                </video>


                <br>
                <br>


                <!-- BOTÓN TOMAR FOTO -->

                <button
                    id="btntomarfoto"
                    type="button"
                    class="btn orange"
                >

                    <i class="material-icons left">
                        photo_camera
                    </i>

                    Tomar foto

                </button>


                <br>
                <br>


                <!-- FOTO TOMADA -->

                <img
                    id="foto"
                    alt="Foto del platillo"
                    style="
                        display: none;
                        width: 100%;
                        max-width: 320px;
                        border-radius: 10px;
                    "
                >


                <!-- CANVAS -->

                <canvas
                    id="canvas"
                    style="display: none;"
                >
                </canvas>


                <!-- ERROR -->

                <p
                    id="cameraError"
                    class="red-text"
                >
                </p>

            </div>

        </div>

    </div>


    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>


    <!-- =========================================
         MATERIALIZE
    ========================================== -->

    <script src="JS/materialize.min.js"></script>


    <!-- =========================================
         FIREBASE DEL PROYECTO
    ========================================== -->

    <script src="JS/firebase.js"></script>

    <script src="JS/index.js"></script>

    <script src="JS/db.js"></script>


</body>

</html>
