    >


    <!-- =========================================
         ESTILOS DE LA CÁMARA
    ========================================== -->

    <style>

        .side-form {
            width: 360px;
            max-width: 100%;
        }


        .camera-section {
            padding: 10px 15px 30px;
        }


        .camera-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }


        .camera-buttons button {
            flex: 1 1 120px;
            min-width: 110px;
            margin: 0;
        }


        .image-input {
            width: 100%;
            margin-bottom: 10px;
        }


        /* =====================================
           CONTENEDOR DE VIDEO
        ====================================== */

        #Camera {
            width: 100%;
            margin-top: 15px;
        }


        /* =====================================
           VIDEO DE LA CÁMARA
        ====================================== */

        #Video {

            display: block;

            width: 100%;

            max-width: 420px;

            height: auto;

            min-height: 220px;

            margin: 15px auto 0;

            border-radius: 12px;

            background: #000;

            object-fit: cover;

            overflow: hidden;

            transform: translateZ(0);

            -webkit-transform: translateZ(0);

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;
        }


        /* =====================================
           FOTO
        ====================================== */

        #foto {

            display: block;

            width: 100%;

            max-width: 420px;

            height: auto;

            margin: 15px auto;

            border-radius: 12px;
        }


        /* =====================================
           ESTADO DE CÁMARA
        ====================================== */

        #cameraStatus {

            margin-top: 10px;

            font-size: 14px;
        }


        #cameraError {

            margin-top: 10px;

            font-size: 14px;
        }


        /* =====================================
           BOTÓN AGREGAR
        ====================================== */

        #btnAgregarPlatillo {

            width: 100%;

            height: 45px;
        }


        /* =====================================
           MÓVILES
        ====================================== */

        @media only screen and (max-width: 600px) {

            .side-form {

                width: 100%;
            }


            .add-recipe {

                padding-left: 20px;

                padding-right: 20px;
            }


            .camera-section {

                padding-left: 20px;

                padding-right: 20px;
            }


            .camera-buttons {

                flex-direction: column;

                gap: 10px;
            }


            .camera-buttons button {

                width: 100%;

                flex: none;

                height: 44px;
            }


            .image-input {

                font-size: 14px;
            }


            #Video {

                width: 100%;

                max-width: 100%;

                min-height: 220px;

                aspect-ratio: 4 / 3;

                object-fit: cover;
            }


            #foto {

                max-width: 100%;
            }

        }


        /* =====================================
           TABLETS Y PC
        ====================================== */

        @media only screen and (min-width: 601px) {

            .side-form {

                width: 400px;
            }

        }

    </style>

</head>


<body class="grey lighten-4">


    <!-- =========================================
         MENÚ SUPERIOR
    ========================================== -->

    <nav class="z-depth-0">

        <div class="nav-wrapper container">

            <a href="index.html">

                DITS

            </a>


            <span class="right grey-text text-darken-1">

                <i
                    class="material-icons sidenav-trigger"
                    data-target="side-menu"
                >

                    menu

                </i>

            </span>

        </div>

    </nav>


    <!-- =========================================
         MENÚ LATERAL
    ========================================== -->

    <ul
        id="side-menu"
        class="sidenav side-menu"
    >

        <li>

            <a class="subheader">

                DITS

            </a>

        </li>


        <li>

            <a
                href="index.html"
                class="waves-effect"
            >

                <i class="material-icons">

                    home

                </i>

                Inicio

            </a>

        </li>


        <li>

            <a
                href="pages/pedidos.html"
                class="waves-effect"
            >

                <i class="material-icons">

                    restaurant_menu

                </i>

                Pedidos

            </a>

        </li>


        <li>

            <a
                href="pages/about.html"
                class="waves-effect"
            >

                <i class="material-icons">

                    info

                </i>

                Acerca

            </a>

        </li>


        <li>

            <div class="divider"></div>

        </li>


        <li>

            <a
                href="pages/contact.html"
                class="waves-effect"
            >

                <i class="material-icons">

                    mail_outline

                </i>

                Contacto

            </a>

        </li>

    </ul>


    <!-- =========================================
         LISTA DE PLATILLOS
    ========================================== -->

    <div
        class="recipes container grey-text text-darken-1"
    >
    </div>


    <!-- =========================================
         BOTÓN AGREGAR
    ========================================== -->

    <div class="center">

        <a
            class="btn-floating btn-large add-btn sidenav-trigger"
            data-target="side-form"
        >

            <i class="material-icons">

                add

            </i>

        </a>

    </div>


    <!-- =========================================
         FORMULARIO AGREGAR PLATILLO
    ========================================== -->

    <div
        id="side-form"
        class="sidenav side-form"
    >

        <form
            id="formAgregar"
            class="add-recipe container section"
        >

            <h6 class="center">

                Nuevo platillo

            </h6>


            <div class="divider"></div>


            <!-- =====================================
                 NOMBRE
            ====================================== -->

            <div class="input-field">

                <input
                    placeholder="Ejemplo: Pizza"
                    id="title"
                    name="title"
                    type="text"
                    class="validate"
                    required
                >

                <label for="title">

                    Nombre

                </label>

            </div>


            <!-- =====================================
                 INGREDIENTES
            ====================================== -->

            <div class="input-field">

                <input
                    placeholder="Ejemplo: Queso, tomate, harina"
                    id="ingredients"
                    name="ingredients"
                    type="text"
                    class="validate"
                    required
                >

                <label for="ingredients">

                    Ingredientes

                </label>

            </div>


            <!-- =====================================
                 PRECIO
            ====================================== -->

            <div class="input-field">

                <input
                    placeholder="Ejemplo: 100"
                    id="price"
                    name="price"
                    type="number"
                    class="validate"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="price">

                    Precio

                </label>

            </div>


            <!-- =====================================
                 FOTO OCULTA
            ====================================== -->

            <input
                id="fotoInput"
                type="hidden"
                value=""
            >


            <!-- =====================================
                 BOTÓN AGREGAR
            ====================================== -->

            <div class="input-field center">

                <button
                    id="btnAgregarPlatillo"
                    type="submit"
                    class="btn waves-effect waves-light"
                >

                    <i class="material-icons left">

                        add

                    </i>

                    Agregar platillo

                </button>

            </div>

        </form>


        <!-- =========================================
             SECCIÓN DE CÁMARA
        ========================================== -->

        <div class="camera-section">


            <h6 class="center">

                <i class="material-icons">

                    camera_alt

                </i>

                Foto del platillo

            </h6>


            <div class="divider"></div>


            <br>


            <!-- =====================================
                 SELECCIONAR IMAGEN
            ====================================== -->

            <div>

                <label for="btnFoto">

                    Seleccionar imagen

                </label>


                <input
                    type="file"
                    id="btnFoto"
                    class="image-input"
                    accept="image/*"
                >

            </div>


            <!-- =====================================
                 BOTONES DE CÁMARA
            ====================================== -->

            <div class="camera-buttons">


                <button
                    id="btnCamara"
                    type="button"
                    class="btn green waves-effect waves-light"
                >

                    <i class="material-icons left">

                        camera_alt

                    </i>

                    Usar cámara

                </button>


                <button
                    id="btnCapturar"
                    type="button"
                    class="btn blue waves-effect waves-light"
                >

                    <i class="material-icons left">

                        photo_camera

                    </i>

                    Capturar

                </button>


                <button
                    id="btnLimpiar"
                    type="button"
                    class="btn red waves-effect waves-light"
                >

                    <i class="material-icons left">

                        delete

                    </i>

                    Limpiar

                </button>


            </div>


            <!-- =====================================
                 ESTADO
            ====================================== -->

            <div
                id="cameraStatus"
                class="center grey-text"
            >

                Cámara lista para tomar una foto.

            </div>


            <!-- =====================================
                 ERROR
            ====================================== -->

            <div
                id="cameraError"
                class="center red-text"
            >
            </div>


            <!-- =====================================
                 CÁMARA
            ====================================== -->

            <div
                id="Camera"
                class="center"
            >

                <video
                    id="Video"
                    autoplay
                    playsinline
                    muted
                    webkit-playsinline
                >

                    Video no disponible

                </video>

            </div>


            <!-- =====================================
                 CANVAS
            ====================================== -->

            <canvas
                id="Canvas"
                style="display:none;"
            >
            </canvas>


            <!-- =====================================
                 FOTO
            ====================================== -->

            <div
                id="Salida"
                class="center"
            >

                <img
                    id="foto"
                    src="img/default.jpg"
                    alt="Foto del platillo"
                >

            </div>


        </div>

    </div>
